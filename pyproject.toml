[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "numiphy"
version = "1.0"
readme = "README.md"
# 3.10 is a hard floor: typing.TypeAlias (lowlevelsupport/lowlevelcallables.py) is 3.10+,
# and symlib/pylambda.py evaluates PEP 604 `X | Y` annotations at import time - it is the one
# symlib module without `from __future__ import annotations`. Nothing here needs 3.11+.
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib>=3.9.2",
    "pybind11"
]

[project.urls]
Homepage = "https://github.com/phyzan/numiphy"
Repository = "https://github.com/phyzan/numiphy.git"

[tool.setuptools.packages.find]
where = ["."]
include = ["numiphy*"]
